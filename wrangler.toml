name = "webdav-proxy-37i4blu"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
UPSTREAM = "https://ewebdav.pcloud.com"
ALLOWED_ORIGINS = "https://readest-web-personal.raven-log.workers.dev,https://*.raven-log.workers.dev,http://localhost:3000,http://127.0.0.1:3000"

# Secrets (set with `wrangler secret put <NAME>`):
#   PROXY_USERNAME  - Basic auth username Readest will use
#   PROXY_PASSWORD  - Basic auth password Readest will use
#   PCLOUD_USERNAME - pCloud account email
#   PCLOUD_PASSWORD - pCloud password
